name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Firebase login plugin
        run: |
          MAJOR=$(node -p "require('./node_modules/@capacitor/core/package.json').version.split('.')[0]")
          npm install @capacitor-firebase/authentication@^$MAJOR firebase
          npm ls @capacitor/core @capacitor-firebase/authentication || true
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json'));c.plugins=c.plugins||{};c.plugins.FirebaseAuthentication={skipNativeAuth:true,providers:['google.com']};fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
      - name: Web files
        run: |
          mkdir www
          cp index.html icon-192.png icon-512.png www/
      - run: npx cap add android
      - name: Google services
        run: cp google-services.json android/app/google-services.json
      - name: Permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' $M
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Icons and splash
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert icon-512.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png
            rm -f $R/mipmap-$n/ic_launcher_foreground.png
          done
          find $R -name splash.png | while read f; do
            convert -size 1080x1920 xc:black \( icon-512.png -resize 400x400 \) -gravity center -composite "$f"
          done
      - name: Version
        run: |
          V=${{ github.run_number }}
          sed -i "s/versionCode 1/versionCode $V/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > keystore.jks
          export KS_CLEAN="$(printf '%s' "$KS_PASS" | tr -d '\r\n')"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          U=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p 4 $U aligned.apk
          $BT/apksigner sign --ks keystore.jks --ks-pass env:KS_CLEAN --key-pass env:KS_CLEAN --ks-key-alias feelchat --out FeelChat.apk aligned.apk
          rm keystore.jks
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" FeelChat.apk --title "Feel Chat v${{ github.run_number }}" --notes "Feel Chat"
      - name: Enable KVM
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test launch on emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: |
            adb install -r FeelChat.apk
            adb logcat -c
            adb shell monkey -p com.feelchat.app -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof com.feelchat.app || echo APP_NOT_RUNNING
            echo ==== CRASH BUFFER ====
            adb logcat -b crash -d | head -70
            echo ==== APP LOG ====
            adb logcat -d | grep -E "feelchat|Capacitor|FirebaseApp|FATAL" | head -60
